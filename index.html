<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Aplikasi Mobile Manajemen Keuangan Pribadi Canggih, Aman, dan Modern" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Anti-Badge / Netlify Drawer Suppressor -->
    <style>
      a[href*="netlify"],
      a[href*="netlify.com"],
      [class*="netlify"],
      [id*="netlify"],
      #netlify-badge,
      .netlify-badge,
      [data-netlify-drawer],
      #netlify-toolbar,
      iframe[src*="netlify"],
      netlify-drawer {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        height: 0 !important;
        width: 0 !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyBadge() {
          try {
            document.querySelectorAll('a[href*="netlify"], iframe[src*="netlify"], [class*="netlify"], [id*="netlify"], netlify-drawer').forEach(function(el) {
              el.remove();
            });
            var walker = document.createTreeWalker(document.body || document.documentElement, NodeFilter.SHOW_TEXT);
            var node;
            var toRemove = [];
            while ((node = walker.nextNode())) {
              if (node.nodeValue && node.nodeValue.toLowerCase().indexOf('powered by netlify') !== -1) {
                var p = node.parentElement;
                while (p && p !== document.body && p !== document.documentElement && p.id !== 'root') {
                  if (p.tagName === 'A' || p.parentElement === document.body) {
                    toRemove.push(p);
                    break;
                  }
                  p = p.parentElement;
                }
              }
            }
            toRemove.forEach(function(el) { el.remove(); });
          } catch(e) {}
        }
        if (typeof document !== 'undefined') {
          document.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          window.addEventListener('load', removeNetlifyBadge);
          var obs = new MutationObserver(removeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
          setInterval(removeNetlifyBadge, 400);
        }
      })();
    </script>

    <title>KeuanganKu - Manajemen Keuangan Pribadi</title>
  </head>
  <body class="bg-[#030712] text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
