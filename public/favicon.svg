<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" filter="url(#glow)" />

  <!-- Modern Shield / Wallet Shape -->
  <path d="M256 100 L380 155 V285 C380 365 256 420 256 420 C256 420 132 365 132 285 V155 Z" fill="url(#shieldGrad)" />

  <!-- Center Card Emblem -->
  <rect x="180" y="210" width="152" height="100" rx="18" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" />
  <rect x="200" y="235" width="34" height="26" rx="6" fill="#fbbf24" />
  <line x1="180" y1="275" x2="332" y2="275" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Upward Growth Sparkle -->
  <path d="M360 140 L370 165 L395 175 L370 185 L360 210 L350 185 L325 175 L350 165 Z" fill="#fbbf24" filter="url(#glow)" />
</svg>
